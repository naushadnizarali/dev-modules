name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        if: github.ref == 'refs/heads/main'
        with:
          go-version-file: go.mod
      - name: Format and commit
        id: commit
        env:
          FORMAT: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          if [[ "$FORMAT" == true ]]; then
            mapfile -d '' files < <(git ls-files -z '*.go')
            if ((${#files[@]})); then
              gofmt -w "${files[@]}"
            fi
            if ! git diff --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add -- '*.go'
              git commit -m 'style: format Go source'
              git push origin HEAD:main
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  check:
    needs: format
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.format.outputs.sha }}

  release-please:
    needs: [format, check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: go
