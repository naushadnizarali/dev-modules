name: Format and release

on:
  push:
    branches: [main]
    tags: ['v1.*.*']
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (run from main)
        type: choice
        options: [patch, minor]
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  format:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        if: github.ref == 'refs/heads/main'
        with:
          go-version-file: go.mod
      - name: Format and commit
        id: commit
        env:
          FORMAT: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          if [[ "$FORMAT" == true ]]; then
            mapfile -d '' files < <(git ls-files -z '*.go')
            if ((${#files[@]})); then
              gofmt -w "${files[@]}"
            fi
            if ! git diff --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add -- '*.go'
              git commit -m 'style: format Go source'
              git push origin HEAD:main
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  check:
    needs: format
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.format.outputs.sha }}

  release:
    needs: [format, check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.format.outputs.sha }}
          fetch-depth: 0
      - name: Create tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump || 'patch' }}
        run: bash .github/scripts/release.sh
